name: NetPulse Odoo tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: netpulse-prototipo-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  odoo-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run client unit and HTTP integration tests
        run: npm run test:client

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coverage
        run: python -m pip install coverage==7.6.1

      - name: Run domain and application tests with coverage
        run: |
          PYTHONPATH=addons python -m coverage run --source=netpulse_core.domain,netpulse_core.application -m unittest discover -s addons/netpulse/tests/unit -p 'test_*.py'
          python -m coverage report --fail-under=70
          python -m coverage html -d addons/netpulse/coverage_html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: netpulse-domain-coverage
          path: addons/netpulse/coverage_html/
          if-no-files-found: error
      - name: Run Odoo 17 module tests
        run: |
          docker run --rm --network host \
            -e HOST=127.0.0.1 -e USER=odoo -e PASSWORD=odoo \
            -e NETPULSE_JWT_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            -e PYTHONPATH=/mnt/extra-addons \
            -v "${GITHUB_WORKSPACE}/addons:/mnt/extra-addons:ro" \
            odoo:17.0 \
            odoo --db_host=127.0.0.1 --db_port=5432 \
              --db_user=odoo --db_password=odoo \
              --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
              --database=netpulse_test --init=netpulse \
              --test-enable --stop-after-init --log-level=test
