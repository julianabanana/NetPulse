openapi: 3.0.3
info:
  title: NetPulse API
  version: 0.2.0
  description: |
    API HTTP del cliente OWL de NetPulse. El inicio de sesión valida las
    credenciales de Odoo y emite un JWT firmado HS256. Las rutas protegidas
    requieren Authorization: Bearer <token>. El token tiene una vigencia de
    30 minutos y se conserva únicamente en memoria en el cliente web.
servers:
  - url: http://localhost:8069/api/v1
    description: Desarrollo local
tags:
  - name: Autenticación
  - name: Incidencias
  - name: Dispositivos
paths:
  /auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión y obtener un JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  example: tecnico@netpulse.com
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Credenciales válidas y JWT emitido
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 1800
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /devices:
    get:
      tags: [Dispositivos]
      summary: Listar dispositivos activos disponibles para vincular incidencias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de dispositivos activos y su cantidad de incidencias abiertas
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /incidents:
    get:
      tags: [Incidencias]
      summary: Listar incidencias visibles para el usuario autenticado
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de incidencias
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IncidentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Incidencias]
      summary: Crear una incidencia
      description: |
        Un técnico queda asignado a sí mismo y se fuerzan prioridad media,
        estado pendiente y origen manual. El administrador puede enviar
        prioridad y técnico.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              properties:
                device_id:
                  type: integer
                description:
                  type: string
                root_cause:
                  type: string
                priority:
                  type: string
                  enum: ['0', '1', '2']
                technician_id:
                  type: integer
      responses:
        '201':
          description: Incidencia creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /incidents/{incident_id}:
    get:
      tags: [Incidencias]
      summary: Consultar el detalle de una incidencia
      security:
        - bearerAuth: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la incidencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /incidents/{incident_id}/state:
    patch:
      tags: [Incidencias]
      summary: Avanzar el estado de una incidencia
      description: Transiciones permitidas: pendiente a en proceso y en proceso a resuelta.
      security:
        - bearerAuth: []
      parameters:
        - name: incident_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [in_progress, resolved]
      responses:
        '200':
          description: Estado actualizado
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Datos inválidos o transición no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Token ausente, inválido o expirado; o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: El usuario autenticado no tiene permisos suficientes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Recurso inexistente o no disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        login:
          type: string
        role:
          type: string
          enum: [admin, technician]
    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        device_type:
          type: string
          enum: [router, switch, other]
        criticality:
          type: string
          enum: [critical, normal]
        status:
          type: string
          enum: [down, up, unknown]
        open_incident_count:
          type: integer
    IncidentSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: INC-0001
        device_id:
          type: array
          items:
            oneOf:
              - type: integer
              - type: string
        root_cause:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: ['0', '1', '2']
        state:
          type: string
          enum: [pending, in_progress, resolved]
        technician_id:
          type: array
          nullable: true
          items:
            oneOf:
              - type: integer
              - type: string
        origin:
          type: string
          enum: [auto, manual]
        date_detected:
          type: string
          format: date-time
    Incident:
      allOf:
        - $ref: '#/components/schemas/IncidentSummary'
        - type: object
          properties:
            date_resolved:
              type: string
              format: date-time
              nullable: true
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
